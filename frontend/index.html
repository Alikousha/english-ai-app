<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cahit Arf English App</title>

<style>

/* 🌈 BASE */
body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;

    background: linear-gradient(135deg, #ffffff 0%, #ffe6e6 40%, #ff4d4d 100%);

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* glow background */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,0,0,0.08), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255,0,0,0.06), transparent 40%);
    pointer-events:none;
}

/* HEADER */
.header{
    position:absolute;
    top:15px;
    text-align:center;
    width:100%;
    z-index:5;
}

.title{
    font-size:20px;
    font-weight:700;
    color:#b30000;
}

.subtitle{
    font-size:12px;
    color:#444;
}

/* LOGO */
.logo-bg{
    position:absolute;
    top:-120px;
    width:100%;
    display:flex;
    justify-content:center;
    opacity:0.10;
    z-index:1;
}

.logo-bg img{
    width:300px;
}

/* 🧊 GLASS CARD (BIG UPGRADE) */
.card{
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.4);

    width:380px;
    padding:22px;
    border-radius:24px;

    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.25);

    z-index:10;
    max-height:90vh;
    overflow:auto;
}

/* WORD */
.word{
    font-size:22px;
    font-weight:700;
    margin:18px 0;
}

/* 🔘 OPTIONS (DUOLINGO STYLE) */
button.option{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:none;
    border-radius:14px;
    background:#f5f5f5;
    cursor:pointer;
    transition:0.25s;
    font-size:15px;
}

button.option:hover{
    background: linear-gradient(135deg,#ff4d4d,#ff1a1a);
    color:white;
    transform:scale(1.02);
}

/* TOP SELECT */
.top{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
}

select{
    padding:6px;
    border-radius:8px;
}

/* XP SYSTEM */
.xp{
    margin-top:10px;
    color:#ff4d4d;
    font-weight:bold;
}

/* XP BAR (NEW) */
.bar{
    width:100%;
    height:8px;
    background:#eee;
    border-radius:10px;
    margin-top:10px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff4d4d,#ff0000);
    transition:0.3s;
}

/* EXAMS */
.exam-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.exam-btn{
    padding:12px;
    border:none;
    border-radius:12px;
    background:#ff4d4d;
    color:white;
    font-weight:bold;
}

/* ANIMATIONS */
.correct{
    animation:pop 0.3s ease;
}

@keyframes pop{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* 📱 MOBILE */
@media (max-width:768px){

    body{
        align-items:flex-start;
        padding-top:70px;
    }

    .card{
        width:94%;
    }

    .title{
        font-size:16px;
    }

    .word{
        font-size:19px;
    }

    .exam-grid{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<div class="header">
    <div class="title">CAHİT ARF EĞİTİM KURUMLARI</div>
    <div class="subtitle">Produced by Ali Kousha</div>
</div>

<div class="logo-bg">
    <img src="logo.png">
</div>

<div class="card">

<div class="top">

<select id="mode" onchange="switchMode()">
<option value="practice">Practice</option>
<option value="quiz">Quiz</option>
<option value="exams">LGS Exams</option>
</select>

<select id="unit" onchange="loadQ()">
<option value="1">Unit 1</option>
<option value="2">Unit 2</option>
<option value="3">Unit 3</option>
<option value="4">Unit 4</option>
<option value="5">Unit 5</option>
<option value="6">Unit 6</option>
<option value="7">Unit 7</option>
<option value="8">Unit 8</option>
<option value="9">Unit 9</option>
<option value="10">Unit 10</option>
</select>

</div>

<div class="word" id="word">Loading...</div>

<div id="options"></div>

<div class="bar"><div class="bar-fill" id="bar"></div></div>

<div class="xp" id="xp">XP: 0</div>

<div id="examSection" style="display:none;margin-top:15px;">

<h3>LGS Exams</h3>

<div class="exam-grid">

<button class="exam-btn" onclick="openExam('2018')">2018</button>
<button class="exam-btn" onclick="openExam('2019')">2019</button>
<button class="exam-btn" onclick="openExam('2020')">2020</button>
<button class="exam-btn" onclick="openExam('2021')">2021</button>
<button class="exam-btn" onclick="openExam('2022')">2022</button>
<button class="exam-btn" onclick="openExam('2023')">2023</button>
<button class="exam-btn" onclick="openExam('2024')">2024</button>
<button class="exam-btn" onclick="openExam('2025')">2025</button>

</div>

</div>

</div>

<script>

let correct="";
let xp=0;

const quizData=[
{question:"She ____ to school every day.",options:["go","goes","going","gone"],correct:"goes"},
{question:"I ____ my homework yesterday.",options:["do","did","done","doing"],correct:"did"},
{question:"They ____ playing football now.",options:["is","are","was","be"],correct:"are"}
];

const examLinks={
"2018":"https://odsgm.meb.gov.tr/meb_iys_dosyalar/2018_06/03153730_SYZEL_BYLYM_A_kitapYY.pdf",
"2019":"https://www.meb.gov.tr/meb_iys_dosyalar/2019_06/02125953_2019_SOZEL_BOLUM.pdf",
"2020":"https://www.meb.gov.tr/meb_iys_dosyalar/2020_06/21195531_2020_sozel_bolum_a.pdf",
"2021":"https://cdn.eba.gov.tr/icerik/lgs/2021_SOZEL_BOLUM_A_.pdf",
"2022":"https://cdn.eba.gov.tr/icerik/lgs/2022_sozel_bolum_a_kitapcigi_ve_cevap_anahtari.pdf",
"2023":"https://msyo.meb.k12.tr/meb_iys_dosyalar/61/02/727852/dosyalar/2023_06/05095005_2023-LGS-SOZEL-KITAPCIGI.pdf",
"2024":"https://msyo.meb.k12.tr/meb_iys_dosyalar/61/02/727852/dosyalar/2024_06/03121642_2024sozelakitapcik.pdf",
"2025":"https://hasanunlukahramanoo.meb.k12.tr/meb_iys_dosyalar/79/01/976865/dosyalar/2025_10/28084845_2025sozel.pdf"
};

function openExam(y){
window.open(examLinks[y],"_blank");
}

async function loadQ(){

let mode=document.getElementById("mode").value;

document.getElementById("examSection").style.display=
(mode==="exams")?"block":"none";

if(mode==="exams"){
document.getElementById("word").innerText="Select exam";
document.getElementById("options").innerHTML="";
return;
}

if(mode==="practice"){

let unit=document.getElementById("unit").value;

let res=await fetch(`https://english-ai-app-n3i0.onrender.com/question?unit=${unit}`);
let data=await res.json();

document.getElementById("word").innerText=data.word;
correct=data.correct;

let html="";
data.options.forEach(o=>{
html+=`<button class="option" onclick="check('${o}')">${o}</button>`;
});

document.getElementById("options").innerHTML=html;

}else{

let q=quizData[Math.floor(Math.random()*quizData.length)];

document.getElementById("word").innerText=q.question;
correct=q.correct;

let html="";
q.options.forEach(o=>{
html+=`<button class="option" onclick="check('${o}')">${o}</button>`;
});

document.getElementById("options").innerHTML=html;
}
}

function check(a){

let bar=document.getElementById("bar");

if(a===correct){
xp+=10;
bar.style.width=xp+"%";

document.body.classList.add("correct");
setTimeout(()=>document.body.classList.remove("correct"),300);

alert("Correct!");
}else{
alert("Wrong!");
}

document.getElementById("xp").innerText="XP: "+xp;
setTimeout(loadQ,300);
}

function switchMode(){
xp=0;
document.getElementById("xp").innerText="XP: 0";
document.getElementById("bar").style.width="0%";
loadQ();
}

loadQ();

</script>

</body>
</html>
